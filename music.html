    <script>
        function setTrack(title, source, image) {
            document.getElementById('trackPlayingTitle').innerHTML = title
            document.getElementById('musicSource').src=source;
            document.getElementById('musicControl').load();
            document.getElementById('musicControl').play();
            document.getElementById('playerContainer').style.backgroundImage = image;
            if (image == "url(\'music/musictocodeto/cover.png\')") {
                document.getElementById('playerContainer').style.backgroundPositionY = "-270px";
            }
            else if (image == "url(\'music/fabrication/cover.jpg\')") {
                document.getElementById('playerContainer').style.backgroundPositionY = "-650px";
            }
            else if (image == "url(\'music/dreamsanddelusions/cover.png\')") {
                document.getElementById('playerContainer').style.backgroundPositionY = "-150px";
            }
            else if (image == "url(\'music/stealindaltons/cover.png\')") {
                document.getElementById('playerContainer').style.backgroundPositionY = "-230px";
            }
        }
    </script>
